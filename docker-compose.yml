services:

  # MYSQL DATABASE
  mysql:
    image: mysql:8.0
    container_name: nat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: natdb
      MYSQL_USER: natuser
      MYSQL_PASSWORD: natpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - nat-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # NODE.JS BACKEND
  backend:
    build: ./nat-backend
    container_name: nat-backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      DB_HOST: mysql
      DB_USER: natuser
      DB_PASSWORD: natpassword
      DB_NAME: natdb
      DB_PORT: 3306
      PORT: 5000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nat-network

  # REACT FRONTEND
  frontend:
    build: ./nat-crud-app
    container_name: nat-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nat-network

volumes:
  mysql_data:

networks:
  nat-network:
    driver: bridge